<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>TG IPTV</title><link rel="stylesheet" href="src/styles.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.12.8/shaka-player.compiled.js"></script></head>
<body><div id="app"><aside class="sidebar"><div class="brand"><img class="brand-logo" src="assets/tg-logo.svg" alt="TG IPTV logo"><div><b>TG IPTV</b><small>DESKTOP PLAYER</small></div></div><nav id="nav"><button class="nav active" data-page="home">⌂ <span>Home</span></button><button class="nav" data-page="live">▣ <span>Live TV</span></button><button class="nav" data-page="favorites">♡ <span>Favorites</span></button><button class="nav" data-page="recent">◷ <span>Recently Watched</span></button><button class="nav" data-page="playlists">▤ <span>Playlists</span></button><button class="nav" data-page="drmlab">◈ <span>DRM Lab</span></button><button class="nav" data-page="settings">⚙ <span>Settings</span></button></nav><div class="sidebar-bottom"><span class="online-dot"></span> Ready to stream</div></aside>
<main class="main"><header class="topbar"><div><div class="eyebrow" id="crumb">YOUR ENTERTAINMENT HUB</div><h1 id="page-title">Home</h1></div><div class="top-actions"><label class="search"><span>⌕</span><input id="global-search" placeholder="Search channels..." autocomplete="off"></label><button class="icon-btn" id="add-playlist" title="Add playlist">＋</button></div></header>
<section id="content"></section></main></div>
<div id="player-modal" class="player-modal hidden"><div class="player-head"><div><b id="playing-title">Now Playing</b><small id="playing-meta"></small></div><div class="player-actions"><button id="pip">▣</button><button id="fullscreen">⛶</button><button id="close-player">✕</button></div></div><div class="video-wrap"><video id="video" controls autoplay playsinline></video><div id="player-error" class="player-error hidden"></div></div><div class="player-footer"><button id="prev-channel">‹ Previous</button><button id="next-channel">Next ›</button><select id="audio-tracks"><option value="">Audio: Auto</option></select><select id="text-tracks"><option value="">Subtitles: Off</option></select><button id="player-fav">♡ Favorite</button></div></div>
<div id="toast" class="toast"></div><script type="module" src="src/main.js"></script></body></html>
