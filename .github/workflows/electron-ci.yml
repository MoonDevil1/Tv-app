name: Electron CI

concurrency:
  group: electron-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [feat/electron-cinema-iptv]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 xvfb ffmpeg
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build renderer and Electron processes
        run: npm run build
      - name: Bundle StreamEngine playback integration
        if: runner.os == 'Linux'
        run: npx vite build --config tests/playback.vite.config.ts
      - name: Real HLS and DASH playback through StreamEngine (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox tests/playback-integration.cjs
      - name: Build unpacked Windows app
        if: runner.os == 'Windows'
        run: npx electron-builder --win --dir --publish never
      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test-windows.ps1
