name: Windows CI
permissions:
  contents: read
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [rebuild/windows-autho-vega]
  pull_request:
    branches: [main]
jobs:
  verify:
    name: Verify Windows application
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Build unpacked Windows application
        run: npx electron-builder --win --dir --publish never
      - name: Smoke test Windows application
        shell: pwsh
        run: ./scripts/smoke-test-windows.ps1
      - name: Upload Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-build-${{ github.run_number }}
          path: release/win-unpacked/
          if-no-files-found: error
          retention-days: 7
