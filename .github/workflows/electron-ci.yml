name: Electron CI

concurrency:
  group: electron-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [feat/electron-cinema-iptv]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build renderer and Electron processes
        run: npm run build
