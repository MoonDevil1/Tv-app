name: Electron CI

permissions:
  contents: write

concurrency:
  group: electron-ci-v2-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [feat/electron-cinema-iptv]
  pull_request:
    branches: [main]

jobs:
  lockfile:
    name: Generate and commit npm lockfile
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/electron-cinema-iptv'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Commit lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git commit -m "Add or update npm lockfile"
          git push origin "HEAD:${GITHUB_REF}"

  verify:
    needs: lockfile
    if: ${{ always() && (needs.lockfile.result == 'success' || needs.lockfile.result == 'skipped') }}
    name: Verify (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Install pinned Shaka Packager
        shell: pwsh
        run: |
          $packager = Join-Path $env:RUNNER_TEMP "packager.exe"
          Invoke-WebRequest "https://github.com/shaka-project/shaka-packager/releases/download/v3.9.3/packager-win-x64.exe" -OutFile $packager
          $hash = (Get-FileHash $packager -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "ef9cdc9f09cd86321f995c4a6b8dcaf96bcc853707caaf304cb9a0e76f6d68f6") { throw "Shaka Packager checksum mismatch: $hash" }
          "SHAKA_PACKAGER_BIN=$packager" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build renderer and Electron processes
        run: npm run build
      - name: Bundle StreamEngine playback integration
        run: npx vite build --config tests/playback.vite.config.ts
      - name: Real HLS, DASH and encrypted ClearKey playback through StreamEngine (Windows)
        run: npx electron tests/playback-integration.cjs
      - name: Build unpacked Windows app
        run: npx electron-builder --win --dir --publish never
      - name: Smoke test packaged Windows app
        shell: pwsh
        run: ./scripts/smoke-test-windows.ps1
