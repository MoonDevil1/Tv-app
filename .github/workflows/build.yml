name: Build LiveTGTV Player
on:
  push:
    branches: [main, feature/livetgtv-player]
  pull_request:
    branches: [main]
jobs:

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm run dist
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: LiveTGTV-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
