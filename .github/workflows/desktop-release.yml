name: Desktop Release

on:
  workflow_dispatch:
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            command: npm run dist:win
          - platform: macos
            os: macos-latest
            command: npm run dist:mac
          - platform: linux
            os: ubuntu-latest
            command: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'feat/electron-cinema-iptv' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set app version from release ref
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${GITHUB_REF_NAME#release/v}"
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 libfuse2t64 xvfb
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build renderer and Electron processes
        run: npm run build
      - name: Build unpacked Windows app
        if: runner.os == 'Windows'
        run: npx electron-builder --win --dir --publish never
      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test-windows.ps1
      - name: Build Windows installers
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
      - name: Build unpacked macOS app
        if: matrix.platform == 'macos'
        run: npx electron-builder --mac --dir --publish never
      - name: Smoke test packaged macOS app
        if: matrix.platform == 'macos'
        run: ./scripts/smoke-test-unix.sh mac
      - name: Build unpacked Linux app
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --dir --publish never
      - name: Smoke test packaged Linux app
        if: matrix.platform == 'linux'
        run: xvfb-run -a ./scripts/smoke-test-unix.sh linux
      - name: Build macOS/Linux installer
        if: runner.os != 'Windows'
        run: ${{ matrix.command }}
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-IPTV-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Resolve release tag
        id: release_meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            echo "tag=v${GITHUB_REF_NAME#release/v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TG IPTV ${{ steps.release_meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
