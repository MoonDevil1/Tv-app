name: Windows Release

on:
  workflow_dispatch:
  create:
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v'))
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set app version from release ref
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = $env:GITHUB_REF_NAME.Substring("release/v".Length)
          }
          npm version $version --no-git-tag-version --allow-same-version
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build renderer and Electron processes
        run: npm run build
      - name: Build unpacked Windows app
        run: npx electron-builder --win --dir --publish never
      - name: Smoke test packaged Windows app
        shell: pwsh
        run: ./scripts/smoke-test-windows.ps1
      - name: Build Windows installers
        run: npx electron-builder --win --publish never
      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TG-IPTV-Windows-x64
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v') || (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v'))
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Resolve release tag
        id: release_meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/heads/release/v*") {
            "tag=v$($env:GITHUB_REF_NAME.Substring('release/v'.Length))" >> $env:GITHUB_OUTPUT
          } else {
            "tag=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
          }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TG IPTV ${{ steps.release_meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
