name: Build TG IPTV for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html','src/**','src-tauri/**','assets/**','package.json','vite.config.js','.github/workflows/build-windows.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
      - name: Build Windows installers
        run: npm run tauri -- build
      - name: Package portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item src-tauri/target/release/tg-iptv.exe portable/
          Copy-Item README.md portable/
          Compress-Archive -Path portable/* -DestinationPath TG-IPTV-Portable.zip -Force
      - name: Upload installers and portable build
        uses: actions/upload-artifact@v4
        with:
          name: TG-IPTV-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/tg-iptv.exe
            TG-IPTV-Portable.zip
